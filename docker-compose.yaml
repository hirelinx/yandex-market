services:
  redis:
    image: redis:7-alpine
    container_name: market-redis
    ports:
      - "6379:6379"

  pay:
    build:
      context: ./pay
      dockerfile: Dockerfile
    container_name: pay-app
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      - pay-data:/data

  app:
    build:
      context: ./market
      dockerfile: Dockerfile
    container_name: market-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PAY_BASE_URL: http://pay:8080
    volumes:
      - market-data:/data
    depends_on:
      - pay
      - redis

volumes:
  market-data:
  pay-data:
