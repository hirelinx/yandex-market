spring:
  application:
    name: market-app

  r2dbc:
    url: r2dbc:h2:file:///${java.io.tmpdir}/pay;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  security:
    oauth2:
      resourceserver:
        jwt:
          # Указываем полный путь до нашего Realm в Keycloak
          issuer-uri: ${ISSUER_URI:http://localhost:8082/realms/market-app}

server:
  port: ${SERVER_PORT:8081}

application:
  init-balance: 1000.0


